<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ShuangKou</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="game-table">

        <div id="player-top" class="ally">
            <div class="player-name">Player 3</div>
            <div class="card-count">27 cards</div>
        </div>

        <div id="player-left" class="opponent">
            <div class="player-name">Player 2</div>
            <div class="card-count">27 cards</div>
        </div>

        <div id="center-play">
            <div id="combination-type">
                No cards played
            </div>

            <div id="played-cards">
                <!-- played cards later -->
            </div>
        </div>

        <div id="player-right" class="opponent">
            <div class="player-name">Player 4</div>
            <div class="card-count">27 cards</div>
        </div>

        <div id="score">
            <!-- score later -->
        </div>

        <div id="player-area">

            <div id="hand"></div>

            <div id="controls">
                <button id="play-button">Play</button>
                <button id="pass-button">Pass</button>
            </div>

        </div>

    </div>

    <script type="module" src="/js/main.js"></script>

</body>
</html>
